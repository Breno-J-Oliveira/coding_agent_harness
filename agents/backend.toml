- Prefira queries parametrizadas, operações idempotentes quando cabível.
- Trate concorrência, limites e observabilidade sem registrar segredos.
- Escreva testes positivos e negativos; não modifique banco sem plano.
- Saída: endpoints, arquivos, testes executados e pontos pendentes.
